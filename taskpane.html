<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CPL CRM</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="taskpane.css"/>
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="8" r="4" fill="white" opacity="0.9"/>
        <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
      </svg>
      <span>CPL CRM</span>
    </div>
    <div id="syncStatus" class="sync-dot sync-idle" title="Status"></div>
  </header>

  <!-- LOADING STATE -->
  <div id="loadingState" class="state-panel">
    <div class="spinner"></div>
    <p class="state-text">Contact opzoeken…</p>
  </div>

  <!-- NOT FOUND STATE -->
  <div id="notFoundState" class="state-panel hidden">
    <div class="state-icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
        <circle cx="11" cy="11" r="7" stroke="var(--muted)" stroke-width="1.5"/>
        <path d="M16.5 16.5L21 21" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M8 11h6M11 8v6" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>
    <p class="state-text">Geen contact gevonden</p>
    <p class="state-sub" id="notFoundEmail"></p>
  </div>

  <!-- ERROR STATE -->
  <div id="errorState" class="state-panel hidden">
    <div class="state-icon error-icon">!</div>
    <p class="state-text">Verbindingsfout</p>
    <p class="state-sub" id="errorMessage"></p>
    <button class="btn btn-secondary" onclick="retryLookup()">Opnieuw proberen</button>
  </div>

  <!-- CONTACT PANEL -->
  <div id="contactPanel" class="hidden">

    <!-- Contact Card -->
    <div class="contact-card">
      <div class="contact-avatar" id="contactAvatar">?</div>
      <div class="contact-info">
        <h2 class="contact-name" id="contactName">—</h2>
        <p class="contact-company" id="contactCompany">—</p>
        <p class="contact-email" id="contactEmail">—</p>
      </div>
      <span class="status-badge" id="statusBadge">—</span>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" onclick="switchTab('overview', this)">Overzicht</button>
      <button class="tab" onclick="switchTab('tasks', this)">Taken <span class="tab-count" id="taskCount">0</span></button>
      <button class="tab" onclick="switchTab('activity', this)">Activiteit</button>
    </div>

    <!-- Tab: Overview -->
    <div id="tab-overview" class="tab-content">
      <div class="section-label">Snelle acties</div>
      <div class="action-grid">
        <button class="action-btn" onclick="openLogActivity()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Log activiteit
        </button>
        <button class="action-btn" onclick="openNewTask()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="3" stroke="currentColor" stroke-width="2"/><path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Nieuwe taak
        </button>
      </div>

      <div class="section-label" style="margin-top:16px">Recente activiteit</div>
      <div id="recentActivity" class="activity-list">
        <p class="empty-hint">Geen recente activiteit</p>
      </div>
    </div>

    <!-- Tab: Tasks -->
    <div id="tab-tasks" class="tab-content hidden">
      <div id="tasksList" class="tasks-list">
        <p class="empty-hint">Geen open taken</p>
      </div>
      <button class="btn btn-primary full-width" style="margin-top:12px" onclick="openNewTask()">+ Nieuwe taak</button>
    </div>

    <!-- Tab: Activity -->
    <div id="tab-activity" class="tab-content hidden">
      <div id="allActivity" class="activity-list">
        <p class="empty-hint">Geen activiteiten gevonden</p>
      </div>
    </div>

  </div>

  <!-- MODAL: Log Activiteit -->
  <div id="modalActivity" class="modal hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Activiteit loggen</h3>
        <button class="modal-close" onclick="closeModal('modalActivity')">✕</button>
      </div>
      <div class="modal-body">
        <label class="field-label">Type</label>
        <div class="type-selector">
          <button class="type-btn active" data-type="email" onclick="selectType(this)">📧 E-mail</button>
          <button class="type-btn" data-type="call" onclick="selectType(this)">📞 Bel</button>
          <button class="type-btn" data-type="meeting" onclick="selectType(this)">📅 Afspraak</button>
        </div>

        <label class="field-label">Onderwerp</label>
        <input type="text" id="activitySubject" class="field-input" placeholder="Bijv. Follow-up voorstel"/>

        <label class="field-label">Notitie</label>
        <textarea id="activityNotes" class="field-input field-textarea" placeholder="Beschrijf de activiteit…"></textarea>

        <label class="field-label">Datum</label>
        <input type="date" id="activityDate" class="field-input"/>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('modalActivity')">Annuleren</button>
        <button class="btn btn-primary" onclick="submitActivity()">Opslaan</button>
      </div>
    </div>
  </div>

  <!-- MODAL: Nieuwe Taak -->
  <div id="modalTask" class="modal hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Nieuwe taak</h3>
        <button class="modal-close" onclick="closeModal('modalTask')">✕</button>
      </div>
      <div class="modal-body">
        <label class="field-label">Omschrijving</label>
        <textarea id="taskDescription" class="field-input field-textarea" placeholder="Wat moet er gedaan worden?"></textarea>

        <label class="field-label">Deadline</label>
        <input type="date" id="taskDueDate" class="field-input"/>

        <label class="field-label">Toegewezen aan</label>
        <input type="text" id="taskAssigned" class="field-input" placeholder="Naam of e-mailadres"/>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('modalTask')">Annuleren</button>
        <button class="btn btn-primary" onclick="submitTask()">Aanmaken</button>
      </div>
    </div>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="toast hidden"></div>

  <script src="taskpane.js"></script>
</body>
</html>
